# Valkey Cluster под управлением официального valkey-operator.
#
#   kubectl create namespace redis-valkey-lab
#   kubectl apply -f operators/valkey/valkey-cluster.yaml
#
# shards: 3, replicasPerShard: 1 — три мастера и три реплики, всего 6 подов.
# API v1alpha1, оператор помечен как early development.

apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: valkey-cluster
  namespace: redis-valkey-lab
  labels:
    app.kubernetes.io/part-of: redis-valkey-lab
spec:
  shards: 3
  replicasPerShard: 1
  workloadType: StatefulSet
  image: docker.io/valkey/valkey:9.1.3

  persistence:
    size: 1Gi
    # Класс задаём явно: default StorageClass в кластере — yc-network-hdd.
    storageClassName: yc-network-ssd
    reclaimPolicy: Delete

  config:
    appendonly: "yes"

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Жёсткая развязка мастера и реплики одного шарда: dimension shard
  # раскладывает поды каждого шарда по зонам и узлам. При replicasPerShard: 1 и
  # трёх зонах primary и replica шарда оказываются в разных зонах и на разных
  # узлах. Preferred (как было раньше) ничего не гарантировал: в замере отказа
  # зоны два мастера из трёх попали в одну зону, выборы не набрали кворум и
  # кластер ушёл в cluster_state:fail.
  # Ограничение: подам нужны зоны для размещения, поэтому при недоступной зоне
  # под остаётся Pending, а не садится рядом с парой.
  scheduling:
    node:
      spread:
        shard:
          mode: Required
    zone:
      spread:
        shard:
          mode: Required

  exporter:
    enabled: false

  # Открытый default user, чтобы valkey-cli работал без пароля.
  # Для стенда допустимо; в production так делать нельзя.
  acl:
    users:
      - name: default
        password:
          type: Any
        permissions: "~* &* +@all"
