# Redis Cluster под управлением OT-CONTAINER-KIT redis-operator.
#
#   kubectl create namespace redis-valkey-lab
#   kubectl apply -f operators/redis/redis-cluster.yaml
#
# clusterSize: 3 — три мастера и три реплики (по одной на шард), всего 6 подов.
# Образ quay.io/opstree/redis:v8.10.1 — последний собранный оператором;
# upstream Redis на момент замера 8.10.3.

apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: redis-cluster
  namespace: redis-valkey-lab
  labels:
    clusterId: redis-cluster
    app.kubernetes.io/part-of: redis-valkey-lab
spec:
  clusterSize: 3
  clusterVersion: v8
  persistenceEnabled: true

  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000

  kubernetesConfig:
    image: quay.io/opstree/redis:v8.10.1
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi

  redisLeader:
    # PDB у оператора не создаётся по умолчанию — включаем явно.
    pdb:
      enabled: true
      maxUnavailable: 1
    # Жёстко: по одному лидеру на зону и на узел. При трёх шардах и трёх зонах
    # это даёт 1/1/1, то есть потеря зоны уносит максимум один мастер и выборы
    # набирают кворум. Ограничение на hostname страхует раскладку при
    # node_count > 3.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            role: leader
            clusterId: redis-cluster
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            role: leader
            clusterId: redis-cluster

  redisFollower:
    pdb:
      enabled: true
      maxUnavailable: 1
    # То же для реплик: 1/1/1 по зонам и узлам. Так реплика каждого шарда
    # почти всегда вне зоны своего мастера, но жёсткой привязки «реплика
    # шарда N к другой зоне» оператор не даёт: лидеры и реплики живут в двух
    # отдельных StatefulSet, и шард в метках пода не отражён. Полную развязку
    # по шардам умеет только valkey-operator (scheduling.zone.spread.shard).
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            role: follower
            clusterId: redis-cluster
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            role: follower
            clusterId: redis-cluster

  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        # Класс задаём явно: default StorageClass в кластере — yc-network-hdd.
        storageClassName: yc-network-ssd
        resources:
          requests:
            storage: 1Gi
    # nodes.conf задан как /node-conf/nodes.conf, а не на PVC: при false это
    # каталог внутри контейнера, он теряется при пересоздании пода, и узел
    # возвращается одиночным мастером (issue #1978, разбор в README).
    nodeConfVolume: false
