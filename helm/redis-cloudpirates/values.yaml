# Redis 8.10.3 через community-чарт CloudPirates: репликация + Sentinel-сайдкар.
#
# Установка (чарт распространяется только по OCI):
#   helm install redis-cloudpirates \
#     oci://registry-1.docker.io/cloudpirates/redis \
#     --version 0.40.0 -n redis-valkey-lab \
#     -f helm/redis-cloudpirates/values.yaml
#
# Чарт 0.40.0 несёт appVersion 8.10.3 и тот же digest, что закреплён ниже.
# Образ всё равно фиксируем тегом и digest: тег без digest может переехать.

architecture: replication
replicaCount: 3

image:
  registry: docker.io
  repository: redis
  tag: "8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53"
  pullPolicy: IfNotPresent

auth:
  enabled: false

sentinel:
  enabled: true
  image:
    registry: docker.io
    repository: redis
    tag: "8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  masterName: mymaster
  quorum: 2
  downAfterMilliseconds: 5000
  failoverTimeout: 60000
  parallelSyncs: 1

persistence:
  enabled: true
  size: 1Gi
  # Класс задаём явно: в кластере по умолчанию yc-network-hdd,
  # а для сравнения Redis и Valkey нужен SSD, как у загрузочных дисков узлов.
  storageClass: yc-network-ssd

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: redis

pdb:
  enabled: true
  # В 0.40.0 maxUnavailable приоритетнее minAvailable: PDB рендерится только
  # с maxUnavailable, обнулять minAvailable больше не нужно.
  maxUnavailable: 1
